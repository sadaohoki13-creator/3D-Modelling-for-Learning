name: Research prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Browser and served-asset checks
        run: |
          npm run preview -- --port 5173 > /tmp/showcase.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          ASSET_BASE_URL=http://localhost:5173 npm run verify:assets
          npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .artifacts/
          if-no-files-found: ignore
